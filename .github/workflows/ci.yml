name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    env:
      # prisma generate needs a URL; nothing connects during these steps.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Production build (offline mode)
    runs-on: ubuntu-latest
    needs: check
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: syllabusos
          POSTGRES_PASSWORD: syllabusos
          POSTGRES_DB: syllabusos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syllabusos" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://syllabusos:syllabusos@localhost:5432/syllabusos
      DIRECT_URL: postgresql://syllabusos:syllabusos@localhost:5432/syllabusos
      AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
