# Local Postgres + pgvector for development. Production uses Neon.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: syllabusos-db
    environment:
      POSTGRES_USER: syllabusos
      POSTGRES_PASSWORD: syllabusos
      POSTGRES_DB: syllabusos
    ports:
      - "5433:5432"
    volumes:
      - syllabusos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syllabusos"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  syllabusos-pg:
